# CI: Lint, Typecheck, Tests, Builds (DM- und Spieler-Variante mit Demo-Daten).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build (DM-Client)
        run: npm run build
      - name: Spieler-Build mit Demo-Daten (inkl. Spoiler-Paranoia-Prüfung)
        run: DATA_DIR=data.example KAMPAGNE=nebelmark-kampagne npm run build:player
